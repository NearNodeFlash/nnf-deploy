daemons:
  - name: nnf-fence
    repository: nnf-sos
    serviceAccount:
      name: nnf-fencing-agent
      namespace: nnf-system
  - name: client-mount
    bin: clientmountd
    buildCmd: make build-daemon
    path: bin/
    repository: nnf-sos
    serviceAccount:
      name: nnf-clientmount
      namespace: nnf-system
    env:
      - name: GOGC
        value: "off"
      - name: GOMEMLIMIT
        value: "20MiB"
      - name: GOMAXPROCS
        value: 5
      - name: HTTP2_PING_TIMEOUT_SECONDS
        value: 60
